# Render Blueprint Specification for Payent Tech Gear Rental Platform (Full-Stack Unified Web Service)
# Documentation: https://render.com/docs/blueprint-spec

services:
  # ---------------------------------------------------------------------------
  # Unified Full-Stack Web Service (FastAPI + React 19 SPA + TiDB Cloud)
  # ---------------------------------------------------------------------------
  - type: web
    name: payent-fullstack
    runtime: python
    region: singapore
    plan: free
    buildCommand: npm install && npm run build && pip install -r requirements.txt
    startCommand: gunicorn backend.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.18.0
      - key: IS_PRODUCTION
        value: "true"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MYSQL_HOST
        value: "gateway01.ap-southeast-1.prod.aws.tidbcloud.com"
      - key: MYSQL_PORT
        value: "4000"
      - key: MYSQL_USER
        value: "3NNZ4KBh8x122Nu.root"
      - key: MYSQL_PASSWORD
        value: "dLNnr55ayiUqR9vU"
      - key: MYSQL_DB
        value: "payent_db"
      - key: MYSQL_SSL
        value: "true"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
