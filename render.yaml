# Render Blueprint Specification for Payent Tech Gear Rental Platform
# Documentation: https://render.com/docs/blueprint-spec

services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI Python Backend Web Service (TiDB Cloud MySQL)
  # ---------------------------------------------------------------------------
  - type: web
    name: payent-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: IS_PRODUCTION
        value: "true"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MYSQL_HOST
        value: "gateway01.ap-southeast-1.prod.aws.tidbcloud.com"
      - key: MYSQL_PORT
        value: "4000"
      - key: MYSQL_USER
        value: "3NNZ4KBh8x122Nu.root"
      - key: MYSQL_PASSWORD
        value: "dLNnr55ayiUqR9vU"
      - key: MYSQL_DB
        value: "payent_db"
      - key: MYSQL_SSL
        value: "true"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  # ---------------------------------------------------------------------------
  # 2. TanStack Start React Frontend Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: payent-frontend
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node .output/server/index.mjs
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_URL
        fromService:
          type: web
          name: payent-backend
          property: url
